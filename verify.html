<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Verified - Hackin9</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Segoe UI,sans-serif}
body{background:#0f1115;display:flex;align-items:center;justify-content:center;min-height:100vh;color:#fff}
.card{background:#181b22;border:1px solid #242832;border-radius:16px;padding:40px;width:100%;max-width:420px;text-align:center}
.icon{width:64px;height:64px;background:#1e3a2a;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
.icon i{font-size:28px;color:#2ecc71}
h1{font-size:22px;margin-bottom:8px} p{color:#8b91a1;font-size:14px;line-height:1.6}
.btn{margin-top:24px;display:inline-block;background:#fff;color:#000;padding:12px 24px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px}
.error .icon{background:#3a1e1e} .error .icon i{color:#e74c3c}
</style>
</head>
<body>
<div class="card" id="card">
<div class="icon"><i class="fa-solid fa-spinner fa-spin"></i></div>
<h1 id="title">Verifying your email</h1>
<p id="desc">Please wait while we confirm your address.</p>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, applyActionCode } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const firebaseConfig = { apiKey: "AIzaSyD8X_PYhwQYDjvoJXfDx58j4CHjS1Zx_cs", authDomain: "h9-database.firebaseapp.com", projectId: "h9-database" };
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const params = new URLSearchParams(location.search);
const oobCode = params.get('oobCode');
const title = document.getElementById('title');
const desc = document.getElementById('desc');
const card = document.getElementById('card');
if(!oobCode){ title.innerText="Invalid link"; desc.innerText="This verification link is missing or malformed."; card.classList.add('error'); }
else{
applyActionCode(auth, oobCode).then(()=>{
card.innerHTML=`<div class="icon"><i class="fa-solid fa-check"></i></div><h1>Email verified successfully</h1><p>Your email has been confirmed. You can now return to the H9 app and sign in.</p><a class="btn" href="https://hackin9.name.ng">Go to Website</a>`;
}).catch(e=>{
card.classList.add('error');
card.innerHTML=`<div class="icon"><i class="fa-solid fa-xmark"></i></div><h1>Link expired</h1><p>${e.message}. Please request a new verification email from the app.</p><a class="btn" href="https://hackin9.name.ng">Go to Website</a>`;
});
}
</script>
</body>
</html>
